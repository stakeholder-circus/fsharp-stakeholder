name: ci-native

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_scaffold.py
      - run: dotnet tool restore --tool-manifest .config/dotnet-tools.json
      - run: dotnet fantomas src tests --check
      - run: dotnet restore tests/FsharpStakeholder.Tests/FsharpStakeholder.Tests.fsproj
      - run: dotnet build tests/FsharpStakeholder.Tests/FsharpStakeholder.Tests.fsproj --no-restore
      - run: dotnet test tests/FsharpStakeholder.Tests/FsharpStakeholder.Tests.fsproj --no-build
